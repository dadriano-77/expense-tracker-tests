services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dadriano-77/expense-tracker-backend:latest}
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - backend-db:/app/server/data
    networks:
      - expense-tracker-net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dadriano-77/expense-tracker-frontend:latest}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - expense-tracker-net

networks:
  expense-tracker-net:

volumes:
  backend-db:
